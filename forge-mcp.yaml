format: forge-code-map-policy/v1
repository_id: grid-view-spec
adapter_version: 1
task_repository: grid-view-spec
task_project: gridviewspec
agents_guidance: AGENTS.md
tasks_db: .forge/tasks.sqlite

roots:
  - src
  - frontend
  - schema
  - tests

docs:
  - docs
  - "*.md"

milestones:
  - docs/milestones

plans:
  - docs/plans

# Package static assets are built from frontend sources or copied vendors.
ignore: [static, vendor, vendors, dist, build]
