# Workspace overlay (`v2`). Unspecified gates, commands, policies, and contours
# inherit from the embedded `code` profile (`gates_merge: patch`).
version: 2
inherit: code
gates_merge: patch

commands:
  test:
    command: "uv run pytest {test_filter}"
    test_filter: "{test}"
    description: "Run targeted pytest suite for the selected test filter."
  build_check:
    command: "./scripts/ci-gate.sh"
    description: "Repository CI gate script covering ruff format/check, basedpyright, pytest, and frontend conformance."
  verify_all:
    command: "./scripts/ci-gate.sh"
    description: "Repository CI gate script covering ruff format/check, basedpyright, pytest, and frontend conformance."
  pytest:
    command: "uv run pytest"
    description: "Registered pytest command retained for existing task proof records."
roles:
  contract_author:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:high'
    guidance: "Spawn a dedicated contract author subagent to define the sensitive failing seam test and contract bounds."
  builder:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'gpt6-luna:xhigh'
    guidance: "Spawn a fresh builder subagent to implement the approved contract inside the declared allowed_write_scope and verify tests."
  independent_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:xhigh'
    guidance: "Use a reviewer worker that is independent from the task builder. Submit review proof across contours, and upon pass claim and submit deliver in the same session."
  delivery_reviewer:
    mode: subagent
    reuse_on_reject: true
    models:
      - 'sol-6.1:xhigh'
    guidance: "Execute delivery under the same independent reviewer authority."
